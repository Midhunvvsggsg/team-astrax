[project]
name = "team-astrax"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<7.0",
    "asgiref>=3.8.0",
    "sqlparse>=0.5.0",
    "python-dotenv>=1.0.0",
    "whitenoise>=6.6.0"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
