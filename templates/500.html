{% extends 'base.html' %}

{% block title %}Server Error (500) - Brightloop{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; text-align: center;">
  <div class="card">
    <div style="font-size: 3.5rem; margin-bottom: var(--space-8); color: var(--color-danger);">⚠️</div>
    <h1 class="card-title">500 - Server Error</h1>
    <p class="card-subtitle" style="margin: var(--space-16) 0 var(--space-24);">
      An unexpected internal server error occurred. Please try again later or contact support.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary">Return to Homepage</a>
  </div>
</div>
{% endblock %}
