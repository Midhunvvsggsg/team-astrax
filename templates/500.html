{% extends 'base.html' %}

{% block title %}Server Error (500) - AstraFlow{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 40px auto; text-align: center;">
  <div class="card" style="padding: var(--space-32) var(--space-24);">
    <div style="font-size: 3.5rem; margin-bottom: var(--space-8); color: var(--color-danger);">⚠️</div>
    <h1 class="card-title" style="margin-bottom: var(--space-8);">500 - Server Error</h1>
    <p class="card-subtitle" style="margin: 0 auto var(--space-24); max-width: 420px; font-size: var(--font-size-base);">
      An unexpected internal server error occurred while processing your request. Please try again later or return to the homepage.
    </p>
    <div style="display: flex; justify-content: center; gap: var(--space-12); flex-wrap: wrap;">
      <a href="{% url 'home' %}" class="btn btn-primary">Return to Homepage</a>
    </div>
  </div>
</div>
{% endblock %}
