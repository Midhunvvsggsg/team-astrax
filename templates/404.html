{% extends 'base.html' %}

{% block title %}Page Not Found (404) - Brightloop{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; text-align: center;">
  <div class="card">
    <div style="font-size: 3.5rem; margin-bottom: var(--space-8); color: var(--color-warning);">🔍</div>
    <h1 class="card-title">404 - Page Not Found</h1>
    <p class="card-subtitle" style="margin: var(--space-16) 0 var(--space-24);">
      The page or resource you are looking for does not exist or has been moved.
    </p>
    <a href="{% url 'home' %}" class="btn btn-primary">Return to Homepage</a>
  </div>
</div>
{% endblock %}
