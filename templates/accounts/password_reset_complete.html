{% extends 'base.html' %}

{% block title %}Password Changed - AstraFlow{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 0 auto;">
  <div class="card" style="text-align: center;">
    <div style="font-size: 3rem; margin-bottom: var(--space-16); color: var(--color-success);">✓</div>
    <h1 class="card-title">Password Successfully Changed</h1>
    <p class="card-subtitle" style="margin: var(--space-16) 0 var(--space-24);">
      Your password has been securely updated. You can now log into your account using your new credentials.
    </p>

    <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%;">
      Sign In Now
    </a>
  </div>
</div>
{% endblock %}
