{% extends 'base.html' %}

{% block title %}Confirm Deletion - AstraFlow{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
  <div class="card" style="text-align: center;">
    <div style="font-size: 3rem; margin-bottom: var(--space-8); color: var(--color-danger);">⚠️</div>
    <h1 class="card-title" style="color: var(--color-danger);">Delete Confirmation</h1>
    <p class="card-subtitle" style="margin: var(--space-16) 0 var(--space-24);">
      Are you sure you want to permanently delete <strong>"{{ object_name }}"</strong>? This action cannot be undone.
    </p>

    <form method="post">
      {% csrf_token %}
      <div style="display: flex; justify-content: center; gap: var(--space-16);">
        <a href="{% if cancel_pk %}{% url cancel_url pk=cancel_pk %}{% else %}{% url cancel_url %}{% endif %}" class="btn btn-secondary">
          Cancel
        </a>
        <button type="submit" class="btn btn-danger">
          Yes, Delete
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
